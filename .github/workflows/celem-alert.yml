name: Monitor CELEM CEP

on:
  schedule:
    # A cada 30 minutos
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check CELEM page
        run: python monitor.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CELEM_URL: "https://www.cep.pr.gov.br/Pagina/CELEM"

      - name: Commit e push do estado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Atualiza celem_state.json"
          file_pattern: "celem_state.json"
